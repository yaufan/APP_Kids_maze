name: maze_adventure
description: "迷宮小冒險：2～5 歲的迷宮遊戲。"
publish_to: 'none'

# The version (also in lib/app/version.dart and CHANGELOG.md; test/version_test.dart checks they agree).
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_svg: ^2.3.0
  flutter_tts: ^4.2.5
  go_router: ^18.1.1
  path: ^1.9.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/art/a/
    - assets/art/a/garden/
    - assets/art/a/tunnel/
    - assets/art/a/sea/
    - assets/art/a/city/
    - assets/art/a/snow/
    - assets/art/a/space/
    - assets/art/b/
    - assets/art/b/garden/
    - assets/art/b/tunnel/
    - assets/art/b/sea/
    - assets/art/b/city/
    - assets/art/b/snow/
    - assets/art/b/space/
    - assets/art/c/
    - assets/art/c/garden/
    - assets/art/c/tunnel/
    - assets/art/c/sea/
    - assets/art/c/city/
    - assets/art/c/snow/
    - assets/art/c/space/
  fonts:
    - family: Huninn
      fonts:
        - asset: assets/fonts/jf-openhuninn-2.1.ttf
